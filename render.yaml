services:
  - type: web
    name: recruitai-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: recruitai-postgres
          property: connectionString
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://agentrouter.org
      - key: AGENTROUTER_MODEL
        value: gpt-6-astra
      - key: FRONTEND_URL
        sync: false

databases:
  - name: recruitai-postgres
    plan: free
    databaseName: recruitai
    user: recruitai_user

